    refChat.onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      chatServeur = d && Array.isArray(d.messages) ? d.messages : [];
      recevoirMessages(chatServeur, !premierChat);
      premierChat = false;
      if (!partage.lectureSeule && manquants(chatServeur, true)) {
        clearTimeout(reparation);
        reparation = setTimeout(ecrireChatClaude, 250 + Math.random() * 400);
      }
    }, () => {});
  }
  async function ecrireChatClaude() {
    if (!refChat) return;
    if (chatEcriture) { aRefaire = true; return; }
    chatEcriture = true;
    try {
      await refChat.set({ messages: derniers(50) });
    } catch (err) {
      if (err && err.code === 'invalid_argument') passerEnLectureSeule();
      else toast('Message non envoyé : connexion perdue.');
    }
    chatEcriture = false;
    if (aRefaire) {
      aRefaire = false;
      ecrireChatClaude();
    }
  }

  rendreChat();

  // ---------- Actions ----------

  function remplir(e) {
    if (balayage) return;
    if (e.pointerType !== 'mouse') envoyerPresence(positionNormalisee(e.clientX, e.clientY));
    if (partage.lectureSeule) { toast('Demande l’accès « Éditeur » pour colorier avec les autres.'); return; }
    const z = zoneSous(e.clientX, e.clientY);
    if (!z || !z.id || couleurs[z.id] === couleurCourante) return;
    const { p, id } = z;
    enregistrer([[id, couleurs[id], p]]);
    const duree = remplirAnime(id, couleurCourante, p);
    publier([[id, couleurCourante, p]]);
    flasher(null, couleurCourante, true);
    eclabousser(e.clientX, e.clientY, couleurCourante);
    sonGoutte(debut[id + 1] - debut[id], duree);
    if (e.pointerType === 'touch') vibrer();
    majBoutons();
    sauvegarder();
  }

  function enregistrer(lot) {
    historique.push(lot);
    if (historique.length > 300) historique.shift();
  }

  function annuler() {
    if (balayage || partage.lectureSeule) return;
    const lot = historique.pop();
    if (!lot) return;
    effacerApercu();
    if (lot.length > 30) {
      terminerAnims();
      for (const [id, avant] of lot) teindre(id, avant);
      lancerBalayage();
    } else {
      for (const [id, avant, depart] of lot) remplirAnime(id, avant, depart);
    }
    publier(lot);
    sonAnnuler();
    majBoutons();
    sauvegarder();
  }

  function effacer() {
    if (balayage || partage.lectureSeule) return;
    const lot = [];
    for (let id = 1; id <= nbZones; id++) if (couleurs[id] !== BLANC) lot.push([id, couleurs[id]]);
    if (!lot.length) return;
    effacerApercu();
    terminerAnims();
    enregistrer(lot);
    couleurs.fill(BLANC);
    couleur32.fill(BLANC);
    publier(lot.map(([id]) => [id, BLANC, -1]));
    lancerBalayage();
    coulee(0.65, 0.7, 2200, 400);
    majBoutons();
    sauvegarder();
  }

  // Publiée sur claude.ai, la page passe par la fenêtre d'enregistrement du lecteur ;
  // ouverte comme simple fichier, elle utilise un lien de téléchargement classique.
  let enregistreur = null;
  if (window.claude && typeof window.claude.use === 'function') {
    btnTelecharger.hidden = true;
    window.claude.use('downloads').then(d => {
      enregistreur = d;
      btnTelecharger.hidden = !d;
    }, () => {});
  }

  function telecharger() {
    effacerApercu();
    terminerAnims();
    canvas.toBlob(async blob => {
      if (!blob) return;
      if (enregistreur) {
        try {
          await enregistreur.save({ filename: 'mon-coloriage-jura.png', data: blob });
        } catch (err) {
          const code = err && err.code;
          if (['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) {
            btnTelecharger.hidden = true;
          }
        }
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mon-coloriage-jura.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  }

  function majBoutons() {
    btnAnnuler.disabled = historique.length === 0 || partage.lectureSeule;
    let colorie = false;
    for (let id = 1; id <= nbZones && !colorie; id++) colorie = couleurs[id] !== BLANC;
    btnEffacer.disabled = !colorie || partage.lectureSeule;
    if (btnEffacer.disabled) desarmerEffacer();
  }

  // ---------- Sauvegarde locale ----------

  function sauvegarder() {
    if (partage.actif) return;   // en partage, la base commune fait foi
    const remplies = [];
    for (let id = 1; id <= nbZones; id++) if (couleurs[id] !== BLANC) remplies.push([id, versHex(couleurs[id])]);
    try {
      localStorage.setItem(CLE_SAUVEGARDE, JSON.stringify({ w: W, h: H, zones: nbZones, remplies }));
    } catch (_) { /* stockage indisponible : tant pis */ }
  }

  function restaurer() {
    try {
      const s = JSON.parse(localStorage.getItem(CLE_SAUVEGARDE) || 'null');
      if (!s || s.w !== W || s.h !== H || s.zones !== nbZones) return;
      for (const [id, hex] of s.remplies) if (id > 0 && id <= nbZones) teindre(id, versU32(hex));
    } catch (_) { /* sauvegarde illisible : on repart de zéro */ }
  }

  // ---------- Palette et curseur ----------

  const palette = $('palette');

  function choisir(hex, pastille, avecEffet) {
    couleurCourante = versU32(hex);
    for (const p of palette.querySelectorAll('.swatch')) p.setAttribute('aria-checked', String(p === pastille));
    majCurseur(hex);
    envoyerPresence({ c: hex });
    if (partage.actif) rendreEquipe();
    if (avecEffet) {
      pastille.classList.remove('pop');
      void pastille.offsetWidth;
      pastille.classList.add('pop');
      sonPastille();
    }
    if (survol) { const id = survol; effacerApercu(); apercu(id); }
  }

  PALETTE.forEach(([hex, nom], i) => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.setProperty('--c', hex);
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-label', nom);
    b.title = nom;
    b.addEventListener('click', () => choisir(hex, b, true));
    palette.appendChild(b);
    if (i === 0) palette.appendChild(Object.assign(document.createElement('span'), { className: 'sep' }));
  });
  {
    const label = document.createElement('label');
    label.className = 'swatch custom';
    label.setAttribute('role', 'radio');
    label.title = 'Autre couleur…';
    const input = document.createElement('input');
    input.type = 'color';
    input.id = 'couleur-perso';
    input.value = '#2a9d8f';
    input.setAttribute('aria-label', 'Autre couleur');
    const appliquer = avecEffet => { label.style.setProperty('--c', input.value); choisir(input.value, label, avecEffet); };
    input.addEventListener('input', () => appliquer(false));
    input.addEventListener('change', () => appliquer(true));
    label.appendChild(input);
    palette.appendChild(label);
  }
  palette.addEventListener('animationend', e => e.target.classList.remove('pop'));

  function majCurseur(hex) {
    const forme = '<path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/>';
    const goutte = '<path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/>';
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="-1 -1 26 26" stroke-linecap="round" stroke-linejoin="round">'
      + `<g fill="#fff" stroke="#fff" stroke-width="4">${forme}${goutte}</g>`
      + `<g fill="none" stroke="#222" stroke-width="1.7">${forme}</g>`
      + `<g fill="${hex}" stroke="#222" stroke-width="1.2">${goutte}</g>`
      + '</svg>';
    canvas.style.cursor = `url("data:image/svg+xml,${encodeURIComponent(svg)}") 26 28, crosshair`;
  }

  // ---------- Zoom et déplacement ----------

  let zoom = 1;
  const ZOOM_MAX = 8;

  function taille() {
    if (!W) return;
    const cs = getComputedStyle(stage);
    const dispoW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const dispoH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const ajuste = Math.max(0.05, Math.min(dispoW / W, dispoH / H));
    canvas.style.width = `${W * ajuste * zoom}px`;
    canvas.style.height = `${H * ajuste * zoom}px`;
  }

  function zoomer(z, cx, cy) {
    z = Math.min(ZOOM_MAX, Math.max(1, z));
    const s = stage.getBoundingClientRect();
    if (cx == null) { cx = s.left + s.width / 2; cy = s.top + s.height / 2; }
    const avant = canvas.getBoundingClientRect();
    const fx = (cx - avant.left) / avant.width, fy = (cy - avant.top) / avant.height;
    zoom = z;
    taille();
    const apres = canvas.getBoundingClientRect();
    stage.scrollLeft += apres.left + fx * apres.width - cx;
    stage.scrollTop += apres.top + fy * apres.height - cy;
    sortieZoom.value = `${Math.round(zoom * 100)} %`;
    placerCurseurs();
    btnZoomMoins.disabled = zoom <= 1;
    btnZoomPlus.disabled = zoom >= ZOOM_MAX;
  }

  btnZoomPlus.addEventListener('click', () => zoomer(zoom * 1.5));
  btnZoomMoins.addEventListener('click', () => zoomer(zoom / 1.5));
  stage.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoomer(zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  }, { passive: false });
  new ResizeObserver(() => { taille(); taillerEffets(); placerCurseurs(); }).observe(stage);
  stage.addEventListener('scroll', placerCurseurs, { passive: true });

  // Glisser (souris ou doigt) pour se déplacer, pincer à deux doigts pour zoomer.
  const pointeurs = new Map();
  let glisse = null, pince = null, ignorerClic = false;
  const ecart = () => { const [a, b] = pointeurs.values(); return Math.hypot(a.x - b.x, a.y - b.y); };
  const milieu = () => { const [a, b] = pointeurs.values(); return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  const debuterGlisse = (x, y, bouge) => {
    glisse = { x, y, sl: stage.scrollLeft, st: stage.scrollTop, bouge };
  };

  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!pointeurs.size) ignorerClic = false;
    pointeurs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointeurs.size === 1) {
      debuterGlisse(e.clientX, e.clientY, false);
    } else if (pointeurs.size === 2) {
      const m = milieu();
      pince = { d: ecart() || 1, z: zoom, mx: m.x, my: m.y };
      ignorerClic = true;
    }
  });
  window.addEventListener('pointermove', e => {
    const p = pointeurs.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if (pince && pointeurs.size >= 2) {
      const m = milieu();
      stage.scrollLeft -= m.x - pince.mx;
      stage.scrollTop -= m.y - pince.my;
      pince.mx = m.x; pince.my = m.y;
      zoomer(pince.z * ecart() / pince.d, m.x, m.y);
    } else if (glisse) {
      const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y;
      if (!glisse.bouge && Math.hypot(dx, dy) > 6) { glisse.bouge = true; stage.classList.add('dragging'); }
      if (glisse.bouge) { stage.scrollLeft = glisse.sl - dx; stage.scrollTop = glisse.st - dy; }
    }
  });
  const relacher = e => {
    if (!pointeurs.delete(e.pointerId)) return;
    if (pointeurs.size === 1) {
      // On repart du doigt restant, sans saut.
      pince = null;
      const [p] = pointeurs.values();
      debuterGlisse(p.x, p.y, true);
    } else if (!pointeurs.size) {
      if (glisse && glisse.bouge) ignorerClic = true;
      glisse = null;
      pince = null;
      stage.classList.remove('dragging');
    }
  };
  window.addEventListener('pointerup', relacher);
  window.addEventListener('pointercancel', relacher);
  // Safari iOS : empêche le zoom de toute la page pendant un pincement.
  document.addEventListener('gesturestart', e => e.preventDefault());

  canvas.addEventListener('click', e => {
    if (ignorerClic) { ignorerClic = false; return; }
    if (zones) remplir(e);
  });
  btnAnnuler.addEventListener('click', annuler);
  btnEffacer.addEventListener('click', demanderEffacer);
  btnTelecharger.addEventListener('click', telecharger);
  window.addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement) return;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); annuler(); }
  });

  // ---------- Démarrage ----------

  choisir(PALETTE[1][0], palette.querySelectorAll('.swatch')[1], false);

  const charger = src => new Promise((ok, ko) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.onerror = ko;
    i.src = src;
  });
  Promise.all([
    charger($('dessin-source').textContent.trim()),
    charger($('masque-source').textContent.trim()),
  ]).then(([img, masque]) => setTimeout(() => {
    analyser(img, masque);
    N = W * H;
    marque = new Uint32Array(N);
    canvas.width = W;
    canvas.height = H;
    calqueCouleur = ctx.createImageData(W, H);
    couleur32 = new Uint32Array(calqueCouleur.data.buffer);
    couleur32.fill(BLANC);
    couleurs = new Uint32Array(nbZones + 1).fill(BLANC);
    toutRendre();
    taille();
    taillerEffets();
    majBoutons();
    btnTelecharger.disabled = false;
    $('chargement').remove();
    brancherPartage().then(partagee => {
      if (partagee) return;
      restaurer();
      toutRendre();
      majBoutons();
    });
  }, 30));
});
</script>
