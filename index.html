<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coloriage du Jura</title>
<meta name="description" content="Coloriage en ligne au pot de peinture : choisis une couleur et touche une zone pour la remplir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Une seule page-outil : en-tête d'actions, dessin au centre, palette en bas. */
  :root {
    --bg: #eceee5;
    --panel: #fbfcf7;
    --ink: #262a24;
    --muted: #6a7063;
    --line: #d9ddcd;
    --accent: #2f6b4f;
    --accent-ink: #ffffff;
    --ring: #262a24;
    --swatch-edge: rgb(30 40 25 / .16);
    --live: #2e9e5b;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgb(30 45 25 / .06), 0 8px 24px rgb(30 45 25 / .10);
    --font-display: Fredoka, ui-rounded, system-ui, sans-serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171a16;
      --panel: #22261f;
      --ink: #eaeee3;
      --muted: #9ca394;
      --line: #353b31;
      --accent: #6fbf95;
      --accent-ink: #10231a;
      --ring: #eaeee3;
      --swatch-edge: rgb(255 255 255 / .22);
      --live: #5fd08e;
      --danger: #e0645a;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171a16;
    --panel: #22261f;
    --ink: #eaeee3;
    --muted: #9ca394;
    --line: #353b31;
    --accent: #6fbf95;
    --accent-ink: #10231a;
    --ring: #eaeee3;
    --swatch-edge: rgb(255 255 255 / .22);
    --live: #5fd08e;
    --danger: #e0645a;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.4 var(--font-ui);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-columns: minmax(0, 1fr);
    -webkit-tap-highlight-color: transparent;
  }

  /* En-tête */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand-mark {
    width: 38px; height: 38px; flex: none;
    border-radius: 11px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 22px; height: 22px; }
  h1 { margin: 0; font: 600 21px/1.1 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
  .hint { margin: 2px 0 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.partage .hint { display: none; }
  .direct { display: flex; align-items: center; gap: 8px; margin: 3px 0 0; font-size: 13px; color: var(--muted); min-width: 0; }
  .direct .point { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--live); animation: pouls 2s ease-out infinite; }
  .direct.lecture .point { background: var(--muted); animation: none; }
  @keyframes pouls {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); }
    70%, 100% { box-shadow: 0 0 0 7px transparent; }
  }
  .direct-texte { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; flex: none; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink);
    font: inherit; font-weight: 500; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.icone { width: 38px; padding: 0; justify-content: center; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn:focus-visible, .zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Zone de dessin */
  /* En partage, le panneau des connectés prend la droite (ou une bande en haut sur téléphone). */
  main { position: relative; min-height: 0; --droite: 0px; --haut: 0px; }
  body.partage main { --droite: 296px; }
  .stage {
    position: absolute; top: var(--haut); bottom: 0; left: 16px; right: calc(16px + var(--droite));
    display: flex; overflow: auto; padding: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    overscroll-behavior: contain;
    touch-action: none;
  }
  .stage.dragging, .stage.dragging #dessin { cursor: grabbing !important; }
  #dessin {
    display: block; flex: none; margin: auto;
    background: #fff; border-radius: 4px; box-shadow: var(--shadow);
    cursor: crosshair; user-select: none; -webkit-user-select: none;
  }
  #effets {
    position: absolute; top: var(--haut); left: 16px;
    width: calc(100% - 32px - var(--droite)); height: calc(100% - var(--haut));
    border-radius: 16px; pointer-events: none;
  }
  #curseurs {
    position: absolute; top: var(--haut); left: 16px;
    width: calc(100% - 32px - var(--droite)); height: calc(100% - var(--haut));
    overflow: hidden; border-radius: 16px; pointer-events: none;
  }
  .curseur { position: absolute; left: 0; top: 0; transition: transform .09s linear; will-change: transform; }
  .curseur svg { display: block; width: 18px; height: 18px; margin: -2px 0 0 -2px; filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / .35)); }
  .curseur path { fill: var(--u); stroke: #fff; stroke-width: 1.4; stroke-linejoin: round; }
  .curseur .nom {
    position: absolute; left: 13px; top: 15px;
    display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 5px;
    border-radius: 9px; background: var(--u); color: #fff;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 1px 3px rgb(0 0 0 / .25);
  }
  .curseur .nom::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--p); box-shadow: 0 0 0 1.5px #fff; }
  .colonne {
    position: absolute; top: 0; bottom: 0; right: 16px; width: 280px;
    display: none; flex-direction: column; gap: 12px; min-height: 0;
  }
  body.partage .colonne { display: flex; }
  .panneau {
    display: flex; flex-direction: column; gap: 12px; padding: 14px;
    flex: 0 1 auto; max-height: 52%; min-height: 0; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  }
  .chat {
    flex: 1 1 0; min-height: 180px;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  }
  .chat-tete { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 10px 0 14px; font: 600 16px/1.2 var(--font-display); }
  .chat-fermer {
    display: none; place-items: center; margin-left: auto; width: 34px; height: 34px;
    border: 0; border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer;
  }
  .chat-fermer svg { width: 18px; height: 18px; }
  .messages {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 3px;
    margin: 0; padding: 4px 12px 10px; list-style: none;
  }
  .message { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .message-tete { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .message-tete .pastille { width: 8px; height: 8px; flex: none; border-radius: 50%; }
  .message-tete .auteur { font-weight: 600; color: var(--ink); }
  .message-tete time { font-variant-numeric: tabular-nums; }
  .bulle {
    margin: 0; max-width: 92%; padding: 6px 10px;
    border-radius: 4px 12px 12px 12px; background: var(--bg);
    font-size: 14px; line-height: 1.35; overflow-wrap: anywhere;
  }
  .message.moi { align-items: flex-end; }
  .message.moi .message-tete { flex-direction: row-reverse; }
  .message.moi .bulle { background: var(--accent); color: var(--accent-ink); border-radius: 12px 4px 12px 12px; }
  .chat-vide { margin: auto; padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .chat-saisie { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  .chat-saisie input {
    flex: 1; min-width: 0; height: 38px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); font: 14px var(--font-ui);
  }
  .chat-saisie input::placeholder { color: var(--muted); }
  .chat-saisie input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ouvrir-chat { display: none; position: relative; }
  .badge {
    position: absolute; top: -5px; right: -6px; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 9px; background: var(--danger); color: #fff;
    font: 700 10px/17px var(--font-ui); text-align: center;
  }
  .panneau-titre { display: flex; align-items: center; gap: 8px; font: 600 16px/1.2 var(--font-display); }
  .panneau-titre .point { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--live); }
  .compte {
    margin-left: auto; min-width: 24px; padding: 1px 8px; border-radius: 10px;
    background: var(--bg); color: var(--muted); text-align: center;
    font: 600 12px/1.6 var(--font-ui); font-variant-numeric: tabular-nums;
  }
  .pseudo { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
  .pseudo input {
    width: 100%; height: 36px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--ink); font: 500 14px var(--font-ui);
  }
  .pseudo input::placeholder { color: var(--muted); }
  .pseudo input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .connectes { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .connecte { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 6px 8px; border-radius: 10px; }
  .connecte.moi { background: var(--bg); }
  .connecte.peint { animation: peint .9s ease-out; }
  @keyframes peint { from { background: color-mix(in srgb, var(--flash) 40%, transparent); } }
  .initiale {
    width: 28px; height: 28px; flex: none; display: grid; place-items: center;
    border-radius: 50%; color: #fff; font: 600 13px/1 var(--font-display);
  }
  .connecte .nom { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 500; }
  .connecte .toi { flex: none; font-size: 12px; color: var(--muted); }
  .connecte .encre {
    margin-left: auto; width: 16px; height: 16px; flex: none;
    border-radius: 50%; border: 1px solid var(--swatch-edge);
  }
  .panneau-note { margin: 0; font-size: 12px; color: var(--muted); }
  .partager { justify-content: center; flex: none; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; z-index: 5;
    max-width: calc(100% - 32px); padding: 9px 14px;
    border-radius: 10px; background: var(--ink); color: var(--bg);
    font-size: 14px; text-align: center;
    opacity: 0; transform: translate(-50%, 8px); pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }
  .btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 14px; pointer-events: none;
  }
  .zoom {
    flex: none; display: flex; align-items: center; gap: 2px; padding: 3px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .zoom button {
    width: 34px; height: 34px; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer;
  }
  .zoom button:hover:not(:disabled) { background: var(--bg); }
  .zoom button:disabled { opacity: .35; cursor: default; }
  .zoom button svg { width: 18px; height: 18px; }
  .zoom output { min-width: 46px; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Palette */
  footer { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .palette { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 4px; }
  .swatch {
    position: relative; flex: none;
    width: 30px; height: 30px; padding: 0;
    border: 1px solid var(--swatch-edge); border-radius: 50%;
    background: var(--c); cursor: pointer;
    transition: transform .12s ease;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ring); transform: scale(1.1); }
  .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .swatch.custom { background: conic-gradient(#e63946, #fcbf49, #a7c957, #4cc9f0, #4361ee, #b5179e, #e63946); }
  .swatch.custom::after {
    content: ""; position: absolute; inset: 7px; border-radius: 50%;
    background: var(--c, var(--panel)); border: 1px solid var(--swatch-edge);
  }
  .swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  .swatch.pop { animation: pop .42s cubic-bezier(.34, 1.9, .5, 1); }
  @keyframes pop {
    0% { transform: scale(.78); }
    100% { transform: scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .swatch, .curseur { transition: none; }
    .swatch.pop { animation: none; }
    .direct .point { animation: none; }
  }
  .sep { width: 1px; align-self: stretch; margin: 2px 3px; background: var(--line); }

  @media (max-width: 640px) {
    .btn { padding: 0 10px; }
    .btn .label, .hint { display: none; }
    h1 { font-size: 18px; }
    .direct { font-size: 12px; }
    .btn.icone { width: 36px; }
    .palette { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; padding: 6px 4px; }
    .palette::-webkit-scrollbar { display: none; }
    .swatch { width: 36px; height: 36px; }
    footer { gap: 8px; }
    .zoom output { display: none; }
  }
  @media (max-width: 760px) {
    body.partage main { --droite: 0px; --haut: 56px; }
    .colonne { bottom: auto; left: 16px; width: auto; height: 46px; }
    .panneau {
      flex: 1; height: 46px; max-height: none;
      flex-direction: row; align-items: center; gap: 8px; padding: 0 6px 0 10px;
      border-radius: 12px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    }
    .ouvrir-chat { display: inline-flex; order: -2; flex: none; width: 34px; height: 32px; padding: 0; justify-content: center; }
    .chat {
      display: none; position: fixed; z-index: 6;
      left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 128px); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
      min-height: 0; box-shadow: var(--shadow);
    }
    body.chat-ouvert .chat { display: flex; }
    .chat-fermer { display: grid; }
    .panneau::-webkit-scrollbar { display: none; }
    .panneau-titre .libelle, .pseudo span, .panneau-note, .connecte .toi { display: none; }
    .compte { margin-left: 0; }
    .pseudo input { width: 116px; height: 32px; }
    .partager { order: -1; margin: 0; height: 32px; width: 34px; padding: 0; }
    .connectes { display: flex; gap: 4px; }
    .connecte { flex: none; padding: 3px 9px 3px 3px; border-radius: 16px; background: var(--bg); }
    .initiale { width: 24px; height: 24px; font-size: 12px; }
    .connecte .nom { max-width: 96px; font-size: 13px; }
    .connecte .encre { width: 12px; height: 12px; }
  }
  @media (max-width: 420px) { .brand-mark { display: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>
    </div>
    <div style="min-width:0">
      <h1>Coloriage du Jura</h1>
      <p class="hint">Choisis une couleur, puis touche une zone du dessin pour la remplir.</p>
      <p class="direct" id="direct" hidden><span class="point" aria-hidden="true"></span><span class="direct-texte" id="direct-texte">Connexion au dessin partagé…</span></p>
    </div>
  </div>
  <div class="actions">
    <button class="btn icone" id="son" aria-pressed="true" title="Couper le son" aria-label="Couper le son">
      <svg class="son-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <svg class="son-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
    <button class="btn" id="annuler" disabled title="Annuler (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span class="label">Annuler</span>
    </button>
    <button class="btn" id="effacer" disabled title="Tout effacer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      <span class="label">Recommencer</span>
    </button>
    <button class="btn primary" id="telecharger" disabled title="Télécharger en PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      <span class="label">Télécharger</span>
    </button>
  </div>
</header>

<main>
  <div class="stage" id="stage">
    <canvas id="dessin" aria-label="Dessin à colorier"></canvas>
  </div>
  <canvas id="effets" aria-hidden="true"></canvas>
  <div id="curseurs" aria-hidden="true"></div>
  <div class="colonne">
  <aside class="panneau" id="panneau" aria-label="Personnes connectées">
    <button class="btn ouvrir-chat" id="ouvrir-chat" type="button" aria-label="Ouvrir le tchat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      <span class="badge" id="badge-chat" hidden>0</span>
    </button>
    <div class="panneau-titre"><span class="point" aria-hidden="true"></span><span class="libelle">Connectés</span><span class="compte" id="nb-connectes">1</span></div>
    <label class="pseudo">
      <span>Ton pseudo</span>
      <input id="pseudo" type="text" maxlength="24" autocomplete="nickname" spellcheck="false" placeholder="Choisis un pseudo" aria-label="Ton pseudo">
    </label>
    <ul class="connectes" id="connectes"></ul>
    <button class="btn partager" id="partager-lien" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span class="label">Copier le lien</span>
    </button>
    <p class="panneau-note" id="panneau-note">Chacun voit les couleurs des autres arriver en direct.</p>
  </aside>
  <section class="chat" id="chat" aria-label="Tchat">
    <div class="chat-tete">
      <span>Tchat</span>
      <button class="chat-fermer" id="chat-fermer" type="button" aria-label="Fermer le tchat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <ol class="messages" id="messages" aria-live="polite"></ol>
    <form class="chat-saisie" id="chat-form">
      <input id="chat-texte" type="text" maxlength="300" autocomplete="off" placeholder="Écris un message…" aria-label="Message">
      <button class="btn primary icone" type="submit" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </form>
  </section>
  </div>
  <div class="loading" id="chargement">Préparation du dessin…</div>
</main>

<footer>
  <div class="palette" id="palette" role="radiogroup" aria-label="Couleurs"></div>
  <div class="zoom" aria-label="Zoom">
    <button id="zoom-moins" aria-label="Dézoomer" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <output id="zoom-valeur">100 %</output>
    <button id="zoom-plus" aria-label="Zoomer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="mqtt.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  'use strict';

  // Les zones plus petites (poussières, hachures) sont fusionnées avec leurs voisines.
  const TAILLE_MIN = 8;
  const CLE_SAUVEGARDE = 'coloriage-jura-v1';
  const CLE_SON = 'coloriage-jura-son';
  const CLE_PSEUDO = 'coloriage-jura-pseudo';
  const BLANC = 0xffffffff;
  const NOIR = 0xff000000;
  const MOUVEMENT_REDUIT = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PALETTE = [
    ['#ffffff', 'Blanc (gomme)'],
    ['#e63946', 'Rouge'], ['#8c1c3a', 'Vin rouge'], ['#f28482', 'Rose'], ['#ffc2d1', 'Rose pâle'],
    ['#f77f00', 'Orange'], ['#fcbf49', 'Jaune comté'], ['#ffe66d', 'Jaune'], ['#f6e3a7', 'Crème'],
    ['#1b4332', 'Vert sapin'], ['#40916c', 'Vert'], ['#74c69d', 'Vert clair'], ['#a7c957', 'Vert pomme'], ['#606c38', 'Olive'],
    ['#1d3557', 'Bleu nuit'], ['#457b9d', 'Bleu'], ['#8ecae6', 'Bleu ciel'], ['#cdeaf5', 'Ciel pâle'],
    ['#6d597a', 'Violet'], ['#b8a1d9', 'Lavande'],
    ['#5e3a1a', 'Brun'], ['#a0693a', 'Bois'], ['#d4a373', 'Sable'], ['#f1c9a5', 'Peau claire'], ['#c68642', 'Peau dorée'],
    ['#dee2e6', 'Gris clair'], ['#8d949a', 'Gris pierre'], ['#343a40', 'Anthracite'],
  ];

  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const canvas = $('dessin');
  const ctx = canvas.getContext('2d');
  const effets = $('effets');
  const fx = effets.getContext('2d');
  const btnAnnuler = $('annuler'), btnEffacer = $('effacer'), btnTelecharger = $('telecharger'), btnSon = $('son');
  const btnZoomMoins = $('zoom-moins'), btnZoomPlus = $('zoom-plus'), sortieZoom = $('zoom-valeur');

  const versU32 = hex => {
    const v = parseInt(hex.slice(1), 16);
    return (0xff000000 | ((v & 0xff) << 16) | (v & 0xff00) | (v >>> 16)) >>> 0;
  };
  const versHex = u => '#' + [u & 255, (u >>> 8) & 255, (u >>> 16) & 255]
    .map(n => n.toString(16).padStart(2, '0')).join('');
  // Mélange de deux couleurs empaquetées (a = 0 : u, a = 1 : v).
  const melange = (u, v, a) => {
    const c = s => {
      const x = (u >>> s) & 255;
      return Math.round(x + (((v >>> s) & 255) - x) * a);
    };
    return (0xff000000 | (c(16) << 16) | (c(8) << 8) | c(0)) >>> 0;
  };
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  let W = 0, H = 0, N = 0;
  let zones;        // Int32Array : numéro de zone de chaque pixel
  let debut;        // Int32Array : pixels de la zone z = pixels[debut[z] .. debut[z+1]-1]
  let pixels;       // Int32Array : indices de pixels triés par zone
  let cadres;       // Int32Array : boîte englobante de chaque zone (x0, y0, x1, y1)
  let nbZones = 0;
  let traits;       // canvas avec le trait nettoyé, posé en « produit » sur les couleurs
  let calqueCouleur, couleur32;
  let couleurs;     // Uint32Array : couleur de chaque zone (état final, hors animation)
  let marque, tampon = 0;
  let couleurCourante = versU32('#e63946');
  const historique = [];

  // ---------- Analyse du dessin ----------

  function analyser(img, masque) {
    W = img.naturalWidth; H = img.naturalHeight;
    const N = W * H;
    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    const tctx = tmp.getContext('2d', { willReadFrequently: true });
    tctx.drawImage(img, 0, 0);
    const donnees = tctx.getImageData(0, 0, W, H);
    const px = donnees.data;
    // Le masque des traits (luminance < 170) est précalculé et livré en PNG sans perte :
    // tous les navigateurs découpent ainsi exactement les mêmes zones, ce qui permet
    // de partager les couleurs entre plusieurs ordinateurs.
    tctx.drawImage(masque, 0, 0);
    const mk = tctx.getImageData(0, 0, W, H).data;

    // Pixels de trait + trait nettoyé pour l'affichage (le blanc cassé devient blanc pur).
    const sombre = new Uint8Array(N);
    for (let i = 0, j = 0; i < N; i++, j += 4) {
      const lum = px[j] * 0.299 + px[j + 1] * 0.587 + px[j + 2] * 0.114;
      sombre[i] = mk[j] < 128 ? 1 : 0;
      const v = Math.min(255, Math.round(lum * 255 / 235));
      px[j] = px[j + 1] = px[j + 2] = v;
      px[j + 3] = 255;
    }
    tctx.putImageData(donnees, 0, 0);
    traits = tmp;

    // Trait épaissi d'1 px pour boucher les petits trous du dessin.
    const mur = new Uint8Array(N);
    for (let y = 0, i = 0; y < H; y++) {
      for (let x = 0; x < W; x++, i++) {
        mur[i] = sombre[i]
          | (x > 0 && sombre[i - 1]) | (x < W - 1 && sombre[i + 1])
          | (y > 0 && sombre[i - W]) | (y < H - 1 && sombre[i + W]);
      }
    }

    // Zones fermées (composantes connexes des pixels clairs).
    zones = new Int32Array(N);
    const file = new Int32Array(N);
    const tailles = [0];
    let n = 0;
    for (let s = 0; s < N; s++) {
      if (mur[s] || zones[s]) continue;
      const id = ++n;
      let haut = 0, taille = 0;
      zones[s] = id; file[haut++] = s;
      while (haut) {
        const i = file[--haut], x = i % W;
        taille++;
        if (x > 0 && !mur[i - 1] && !zones[i - 1]) { zones[i - 1] = id; file[haut++] = i - 1; }
        if (x < W - 1 && !mur[i + 1] && !zones[i + 1]) { zones[i + 1] = id; file[haut++] = i + 1; }
        if (i >= W && !mur[i - W] && !zones[i - W]) { zones[i - W] = id; file[haut++] = i - W; }
        if (i < N - W && !mur[i + W] && !zones[i + W]) { zones[i + W] = id; file[haut++] = i + W; }
      }
      tailles.push(taille);
    }

    // Renumérotation sans les zones minuscules.
    const renum = new Int32Array(n + 1);
    let m = 0;
    for (let id = 1; id <= n; id++) if (tailles[id] >= TAILLE_MIN) renum[id] = ++m;
    for (let i = 0; i < N; i++) zones[i] = renum[zones[i]];
    nbZones = m;

    // Chaque pixel de trait est rattaché à la zone la plus proche (parcours en largeur
    // depuis toutes les zones à la fois) : la couleur passe sous le trait, sans halo blanc.
    let tete = 0, queue = 0;
    for (let i = 0; i < N; i++) if (zones[i]) file[queue++] = i;
    while (tete < queue) {
      const i = file[tete++], id = zones[i], x = i % W;
      if (x > 0 && !zones[i - 1]) { zones[i - 1] = id; file[queue++] = i - 1; }
      if (x < W - 1 && !zones[i + 1]) { zones[i + 1] = id; file[queue++] = i + 1; }
      if (i >= W && !zones[i - W]) { zones[i - W] = id; file[queue++] = i - W; }
      if (i < N - W && !zones[i + W]) { zones[i + W] = id; file[queue++] = i + W; }
    }

    // Pixels regroupés par zone (tri par comptage) + boîtes englobantes.
    debut = new Int32Array(m + 2);
    for (let i = 0; i < N; i++) debut[zones[i] + 1]++;
    for (let id = 1; id <= m + 1; id++) debut[id] += debut[id - 1];
    const pos = debut.slice();
    pixels = new Int32Array(N);
    cadres = new Int32Array(4 * (m + 1));
    for (let id = 0; id <= m; id++) {
      cadres[4 * id] = W; cadres[4 * id + 1] = H; cadres[4 * id + 2] = -1; cadres[4 * id + 3] = -1;
    }
    for (let y = 0, i = 0; y < H; y++) {
      for (let x = 0; x < W; x++, i++) {
        const id = zones[i], c = 4 * id;
        pixels[pos[id]++] = i;
        if (x < cadres[c]) cadres[c] = x;
        if (y < cadres[c + 1]) cadres[c + 1] = y;
        if (x > cadres[c + 2]) cadres[c + 2] = x;
        if (y > cadres[c + 3]) cadres[c + 3] = y;
      }
    }
  }

  // ---------- Rendu ----------

  function rendre(x0, y0, x1, y1) {
    const w = x1 - x0 + 1, h = y1 - y0 + 1;
    ctx.putImageData(calqueCouleur, 0, 0, x0, y0, w, h);
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(traits, x0, y0, w, h, x0, y0, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }
  const toutRendre = () => rendre(0, 0, W - 1, H - 1);
  const rendreZone = id => {
    const c = 4 * id;
    rendre(cadres[c], cadres[c + 1], cadres[c + 2], cadres[c + 3]);
  };

  function teindre(id, couleur) {
    couleurs[id] = couleur;
    for (let k = debut[id], fin = debut[id + 1]; k < fin; k++) couleur32[pixels[k]] = couleur;
  }

  // ---------- Animation du remplissage ----------
  // La peinture coule depuis le point touché en suivant la forme de la zone,
  // avec un bord plus clair et brillant qui avance devant la couleur.

  const anims = new Map();   // zone -> coulée en cours
  let balayage = null;       // « Recommencer » : volet qui repasse tout le dessin
  let boucle = 0;

  // Parcours en largeur depuis le pixel touché, en alternant voisinage 4 et 8 :
  // le front avance en octogone, presque rond, et contourne les obstacles.
  function parcours(id, depart) {
    const n = debut[id + 1] - debut[id];
    const ordre = new Int32Array(n), dist = new Int32Array(n);
    const m = ++tampon;
    marque[depart] = m;
    ordre[0] = depart;
    let tete = 0, fin = 1, d = 0;
    const visite = j => {
      if (zones[j] === id && marque[j] !== m) { marque[j] = m; dist[fin] = d; ordre[fin++] = j; }
    };
    for (let couche = 0; tete < fin; couche++) {
      const finCouche = fin, diag = couche & 1;
      d = couche + 1;
      while (tete < finCouche) {
        const i = ordre[tete++], x = i % W;
        const g = x > 0, dr = x < W - 1, h = i >= W, b = i < N - W;
        if (g) visite(i - 1);
        if (dr) visite(i + 1);
        if (h) visite(i - W);
        if (b) visite(i + W);
        if (diag) {
          if (g && h) visite(i - W - 1);
          if (dr && h) visite(i - W + 1);
          if (g && b) visite(i + W - 1);
          if (dr && b) visite(i + W + 1);
        }
      }
    }
    return { ordre: ordre.subarray(0, fin), dist, D: fin > 1 ? dist[fin - 1] : 0 };
  }

  function remplirAnime(id, couleur, depart) {
    couleurs[id] = couleur;
    if (survol === id) survol = 0;
    if (MOUVEMENT_REDUIT) {
      anims.delete(id);
      teindre(id, couleur);
      rendreZone(id);
      return 0;
    }
    const { ordre, dist, D } = parcours(id, depart);
    const bande = Math.max(6, Math.min(44, D * 0.2));
    // Profil du bord : un liseré un peu plus foncé tout devant (la peinture qui avance),
    // puis un reflet clair juste derrière, qui se fond dans la couleur.
    const teintes = new Uint32Array(16);
    for (let q = 0; q < 16; q++) {
      const f = (q + 0.5) / 16;
      if (f > 0.88) {
        teintes[q] = melange(couleur, NOIR, 0.18);
      } else {
        let s = Math.max(0, 1 - Math.abs(f - 0.62) / 0.3);
        s = s * s * (3 - 2 * s);
        teintes[q] = melange(couleur, BLANC, 0.55 * s);
      }
    }
    const duree = Math.min(1000, 170 + 22 * Math.sqrt(D));
    anims.set(id, { id, couleur, ordre, dist, D, bande, teintes, duree, t0: performance.now(), k: 0 });
    lancer();
    return duree;
  }

  function avancer(a, now) {
    const t = Math.max(0, Math.min(1, (now - a.t0) / a.duree));
    if (t >= 1) {
      teindre(a.id, a.couleur);
      rendreZone(a.id);
      return true;
    }
    const front = (a.D + a.bande) * easeOut(t), finale = front - a.bande;
    const { ordre, dist, couleur, teintes, bande } = a, n = ordre.length;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    const note = i => {
      const x = i % W, y = (i - x) / W;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    };
    let k = a.k;
    while (k < n && dist[k] <= finale) { const i = ordre[k++]; couleur32[i] = couleur; note(i); }
    a.k = k;
    for (let j = k; j < n && dist[j] <= front; j++) {
      const i = ordre[j];
      couleur32[i] = teintes[Math.min(15, ((dist[j] - finale) / bande * 16) | 0)];
      note(i);
    }
    if (x1 >= 0) rendre(x0, y0, x1, y1);
    return false;
  }

  function terminerAnims() {
    for (const a of anims.values()) { teindre(a.id, a.couleur); rendreZone(a.id); }
    anims.clear();
    if (balayage) { balayage = null; toutRendre(); }
  }

  function lancerBalayage() {
    if (MOUVEMENT_REDUIT) { toutRendre(); return; }
    balayage = { t0: performance.now(), x: 0 };
    lancer();
  }

  function avancerBalayage(now) {
    const t = Math.max(0, Math.min(1, (now - balayage.t0) / 650));
    const x = Math.round(easeInOut(t) * W);
    if (x > balayage.x) rendre(balayage.x, 0, x - 1, H - 1);
    balayage.x = x;
    if (t >= 1) balayage = null;
  }

  function lancer() { if (!boucle) boucle = requestAnimationFrame(tick); }

  function tick(now) {
    boucle = 0;
    for (const [id, a] of anims) if (avancer(a, now)) anims.delete(id);
    if (balayage) avancerBalayage(now);
    dessinerEffets(now);
    if (anims.size || balayage || ondes.length || gouttes.length) lancer();
  }

  // ---------- Éclaboussures (calque au-dessus du dessin) ----------

  const ondes = [], gouttes = [];
  let dpr = 1, effetsVisibles = false;

  function taillerEffets() {
    const r = effets.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    effets.width = Math.max(1, Math.round(r.width * dpr));
    effets.height = Math.max(1, Math.round(r.height * dpr));
  }

  function eclabousser(cx, cy, couleur) {
    if (MOUVEMENT_REDUIT) return;
    const r = effets.getBoundingClientRect();
    const x = cx - r.left, y = cy - r.top, now = performance.now(), hex = versHex(couleur);
    ondes.push({ x, y, t0: now, hex, rayon: 40 }, { x, y, t0: now + 110, hex, rayon: 24 });
    const n = 11 + (Math.random() * 6 | 0);
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, v = 0.09 + Math.random() * 0.22;
      gouttes.push({
        x, y, hex,
        vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 0.14,
        r: 1.8 + Math.random() * 2.8,
        t0: now, prec: now, vie: 420 + Math.random() * 360,
      });
    }
    lancer();
  }

  function dessinerEffets(now) {
    if (!ondes.length && !gouttes.length) {
      if (effetsVisibles) { fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, effets.width, effets.height); effetsVisibles = false; }
      return;
    }
    effetsVisibles = true;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    fx.clearRect(0, 0, effets.width, effets.height);
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);

    for (let i = ondes.length - 1; i >= 0; i--) {
      const o = ondes[i], t = (now - o.t0) / 520;
      if (t < 0) continue;
      if (t >= 1) { ondes.splice(i, 1); continue; }
      const e = easeOut(t), rayon = 5 + o.rayon * e, alpha = Math.pow(1 - t, 1.6);
      fx.beginPath();
      fx.arc(o.x, o.y, rayon, 0, Math.PI * 2);
      fx.lineWidth = 3.4 * (1 - t) + 0.6;
      fx.globalAlpha = alpha * 0.25;
      fx.strokeStyle = '#000';
      fx.stroke();
      fx.lineWidth = 2.6 * (1 - t) + 0.5;
      fx.globalAlpha = alpha;
      fx.strokeStyle = o.hex;
      fx.stroke();
    }

    for (let i = gouttes.length - 1; i >= 0; i--) {
      const g = gouttes[i], t = (now - g.t0) / g.vie;
      if (t >= 1) { gouttes.splice(i, 1); continue; }
      const dt = Math.min(40, now - g.prec);
      g.prec = now;
      g.vy += 0.0011 * dt;
      g.vx *= Math.pow(0.996, dt);
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      const vitesse = Math.hypot(g.vx, g.vy), etirement = 1 + Math.min(1.4, vitesse * 3.2);
      const rayon = g.r * (1 - 0.6 * t * t), alpha = t < 0.65 ? 1 : (1 - t) / 0.35;
      fx.globalAlpha = alpha;
      fx.save();
      fx.translate(g.x, g.y);
      fx.rotate(Math.atan2(g.vy, g.vx));
      fx.scale(etirement, 1 / Math.sqrt(etirement));
      fx.beginPath();
      fx.arc(0, 0, rayon, 0, Math.PI * 2);
      fx.fillStyle = g.hex;
      fx.fill();
      fx.lineWidth = 0.7;
      fx.strokeStyle = 'rgba(0,0,0,.28)';
      fx.stroke();
      fx.restore();
      fx.beginPath();
      fx.arc(g.x - rayon * 0.3, g.y - rayon * 0.35, rayon * 0.32, 0, Math.PI * 2);
      fx.globalAlpha = alpha * 0.75;
      fx.fillStyle = '#fff';
      fx.fill();
    }
    fx.globalAlpha = 1;
  }

  // ---------- Son ----------
  // Une goutte qui tombe : un « ploc » pentatonique, plus grave pour les grandes zones,
  // et pour les grandes zones le bruit de la peinture qui coule pendant le remplissage.

  let sonActif = true;
  try { sonActif = localStorage.getItem(CLE_SON) !== '0'; } catch (_) { /* préférence indisponible */ }
  let audio = null, sortie = null, bruitBuf = null;
  const GAMME = [0, 2, 4, 7, 9];

  function contexteAudio() {
    if (!sonActif) return null;
    try {
      if (!audio) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audio = new AC();
        const compresseur = audio.createDynamicsCompressor();
        sortie = audio.createGain();
        sortie.gain.value = 0.8;
        sortie.connect(compresseur).connect(audio.destination);
      }
      if (audio.state === 'suspended') audio.resume();
      return audio;
    } catch (_) {
      return null;
    }
  }

  function ton(ac, t, { type = 'sine', f0, f1, montee, volume, duree }) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + montee);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    o.connect(g).connect(sortie);
    o.start(t);
    o.stop(t + duree + 0.02);
  }

  function sonGoutte(taille, duree, volume = 1) {
    const ac = contexteAudio();
    if (!ac) return;
    const t = ac.currentTime + 0.005;
    const grandeur = Math.max(0, Math.min(1, (Math.log10(taille) - 1.3) / 4));
    const degre = Math.round((1 - grandeur) * 9);
    const f = 330 * Math.pow(2, (12 * Math.floor(degre / 5) + GAMME[degre % 5]) / 12)
      * (1 + (Math.random() - 0.5) * 0.008);
    ton(ac, t, { f0: f * 0.55, f1: f, montee: 0.045, volume: 0.32 * volume, duree: 0.34 });
    ton(ac, t + 0.012, { type: 'triangle', f0: f * 2, f1: f * 2.02, montee: 0.05, volume: 0.05 * volume, duree: 0.16 });
    if (taille > 4000 && duree > 0 && volume === 1) coulee(duree / 1000, grandeur, 450, 1700);
  }

  function coulee(duree, force, fDebut, fFin) {
    const ac = contexteAudio();
    if (!ac) return;
    if (!bruitBuf) {
      bruitBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = bruitBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime;
    const src = ac.createBufferSource(), filtre = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = bruitBuf;
    src.loop = true;
    filtre.type = 'bandpass';
    filtre.Q.value = 1.6;
    filtre.frequency.setValueAtTime(fDebut, t);
    filtre.frequency.exponentialRampToValueAtTime(fFin, t + duree);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05 + 0.06 * force, t + Math.min(0.08, duree / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    src.connect(filtre).connect(g).connect(sortie);
    src.start(t);
    src.stop(t + duree + 0.05);
  }

  function sonPastille() {
    const ac = contexteAudio();
    if (ac) ton(ac, ac.currentTime + 0.005, { f0: 1500, f1: 1150, montee: 0.03, volume: 0.06, duree: 0.06 });
  }

  function sonAnnuler() {
    const ac = contexteAudio();
    if (ac) ton(ac, ac.currentTime + 0.005, { f0: 700, f1: 380, montee: 0.12, volume: 0.14, duree: 0.2 });
  }

  function majSon() {
    btnSon.setAttribute('aria-pressed', String(sonActif));
    btnSon.title = sonActif ? 'Couper le son' : 'Activer le son';
    btnSon.setAttribute('aria-label', btnSon.title);
    btnSon.querySelector('.son-on').hidden = !sonActif;
    btnSon.querySelector('.son-off').hidden = sonActif;
  }

  btnSon.addEventListener('click', () => {
    sonActif = !sonActif;
    try { localStorage.setItem(CLE_SON, sonActif ? '1' : '0'); } catch (_) { /* tant pis */ }
    majSon();
    if (sonActif) sonPastille();
  });
  majSon();

  function vibrer() {
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) { /* pas de vibreur */ }
  }

  // ---------- Aperçu au survol (souris) ----------

  let survol = 0, survolPos = null, survolPrevu = 0;

  function zoneSous(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((cx - r.left) / r.width * W);
    const y = Math.floor((cy - r.top) / r.height * H);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    const p = y * W + x;
    return { p, id: zones[p] };
  }

  function apercu(id) {
    if (id === survol) return;
    effacerApercu();
    if (!id || balayage || partage.lectureSeule || anims.has(id) || couleurs[id] === couleurCourante) return;
    survol = id;
    const teinte = melange(couleurs[id], couleurCourante, 0.32);
    for (let k = debut[id], fin = debut[id + 1]; k < fin; k++) couleur32[pixels[k]] = teinte;
    rendreZone(id);
  }

  function effacerApercu() {
    const id = survol;
    if (!id) return;
    survol = 0;
    if (anims.has(id)) return;
    teindre(id, couleurs[id]);
    rendreZone(id);
  }

  function majApercu() {
    if (!survolPos || !zones) return;
    const z = zoneSous(survolPos.x, survolPos.y);
    apercu(z ? z.id : 0);
  }

  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    envoyerPresence(positionNormalisee(e.clientX, e.clientY));
    if (glisse && glisse.bouge) { survolPos = null; effacerApercu(); return; }
    survolPos = { x: e.clientX, y: e.clientY };
    if (!survolPrevu) survolPrevu = requestAnimationFrame(() => { survolPrevu = 0; majApercu(); });
  });
  canvas.addEventListener('pointerleave', () => { survolPos = null; effacerApercu(); envoyerPresence({ x: null, y: null }); });

  // ---------- Coloriage à plusieurs ----------
  // Publiée sur claude.ai, la page range les couleurs dans une base partagée : chacun voit
  // les remplissages des autres arriver en direct (même coulée, depuis le même point)
  // et les curseurs des personnes présentes. Ouverte comme simple fichier, elle reste en solo.

  const COLLECTION = 'remplissages-v1';
  const PAR_SEAU = 64;   // zones regroupées par document
  const partage = {
    actif: false, mode: null, lectureSeule: false, premier: true,
    db: null, user: null, room: null, monId: null,
    enAttente: new Map(),   // zone -> jeton de ma dernière écriture, pas encore revenue
    seaux: new Map(),       // document -> dernier contenu reçu
    files: new Map(),       // document -> écritures en attente d'envoi
    pairs: [], profils: {},
    connexions: [], etat: new Map(), horloge: 0, dejaConnecte: false,   // partage public (MQTT)
  };
  const jeton = () => Math.random().toString(36).slice(2, 10);
  const nomSeau = id => 'b' + Math.floor(id / PAR_SEAU);
  const attendre = ms => new Promise(r => setTimeout(r, ms));
  const departDe = (id, p) => (p >= 0 && p < N && zones[p] === id ? p : pixels[(debut[id] + debut[id + 1]) >> 1]);

  // Sur claude.ai : base et présence de l'artefact. Ailleurs : serveurs MQTT publics.
  function brancherPartage() {
    if (window.claude && typeof window.claude.use === 'function') return brancherClaude();
    return Promise.resolve(brancherMqtt());
  }

  async function brancherClaude() {
    let db = null;
    try { db = await window.claude.use('db'); } catch (_) { db = null; }
    if (!db) return false;
    partage.db = db;
    partage.actif = true;
    partage.mode = 'claude';
    document.body.classList.add('partage');
    rendreEquipe();
    window.claude.use('user').then(async u => {
      if (!u) return;
      partage.user = u;
      partage.monId = await u.id();
      if (!monPseudo) {
        const moi = await u.me();
        if (moi && moi.name && !monPseudo) definirPseudo(moi.name.split(' ')[0], false);
      }
      if ((await u.can('data.write')) === false) passerEnLectureSeule();
      majEquipe();
    }, () => {});
    window.claude.use('room').then(r => {
      if (!r) return;
      partage.room = r;
      r.onPeers(ch => { partage.pairs = ch.peers; placerCurseurs(); majEquipe(); }, () => {
        partage.room = null;
        partage.pairs = [];
        placerCurseurs();
        rendreEquipe();
      });
      envoyerPresence({ c: versHex(couleurCourante), n: monPseudo || null });
    }, () => {});
    db.collection(COLLECTION).onSnapshot(surInstantane, quitterPartage);
    brancherChatClaude(db);
    return true;
  }

  // Le partage s'est coupé pour de bon : on garde le dessin et on continue en solo.
  function quitterPartage() {
    if (!partage.actif) return;
    partage.actif = false;
    partage.lectureSeule = false;
    document.body.classList.remove('partage');
    rendreEquipe();
    majBoutons();
    sauvegarder();
  }

  function lireEntree(v) {
    if (!v || typeof v !== 'object' || typeof v.c !== 'string' || !/^#[0-9a-f]{6}$/i.test(v.c)) return null;
    return { couleur: versU32(v.c), p: Number.isInteger(v.p) ? v.p : -1, k: typeof v.k === 'string' ? v.k : '', by: typeof v.by === 'string' ? v.by : null };
  }

  function surInstantane(snap) {
    if (!partage.actif) return;
    const changes = [];
    for (const ch of snap.docChanges()) {
      const nom = ch.doc.id;
      const avant = partage.seaux.get(nom) || {};
      const apres = ch.type === 'removed' ? {} : (ch.doc.data() || {});
      partage.seaux.set(nom, apres);
      for (const cle of new Set([...Object.keys(avant), ...Object.keys(apres)])) {
        const id = Number(cle);
        if (!Number.isInteger(id) || id < 1 || id > nbZones) continue;
        const e = lireEntree(apres[cle]);
        const attendu = partage.enAttente.get(id);
        if (attendu) {
          // Ma propre écriture est en route : elle fait foi jusqu'à son retour.
          if (e && e.k === attendu) partage.enAttente.delete(id);
          continue;
        }
        const couleur = e ? e.couleur : BLANC;
        if (couleurs[id] !== couleur) changes.push({ id, couleur, p: e ? e.p : -1, by: e ? e.by : null });
      }
    }
    appliquerDistants(changes);
    partage.premier = false;
    majBoutons();
  }

  function appliquerDistants(changes) {
    if (!changes.length) return;
    if (partage.premier || changes.length > 30) {
      // Arrivée sur la page, « Recommencer » ou annulation en bloc : un volet révèle tout.
      effacerApercu();
      terminerAnims();
      for (const c of changes) teindre(c.id, c.couleur);
      lancerBalayage();
      return;
    }
    for (const c of changes) {
      const depart = departDe(c.id, c.p);
      remplirAnime(c.id, c.couleur, depart);
      ondeDistante(depart, c.couleur);
      flasher(c.by, c.couleur, false);
    }
    const id = changes[0].id;
    sonGoutte(debut[id + 1] - debut[id], 0, 0.35);
  }

  function ondeDistante(p, couleur) {
    if (MOUVEMENT_REDUIT) return;
    const r = canvas.getBoundingClientRect(), e = effets.getBoundingClientRect();
    const x = r.left - e.left + ((p % W) + 0.5) / W * r.width;
    const y = r.top - e.top + (Math.floor(p / W) + 0.5) / H * r.height;
    ondes.push({ x, y, t0: performance.now(), hex: versHex(couleur), rayon: 30 });
    lancer();
  }

  // Envoie mes changements : un document par paquet de zones, une écriture à la fois
  // par document, les changements rapprochés regroupés dans la même écriture.
  function publier(liste) {
    if (!partage.actif) return;
    if (partage.mode === 'mqtt') { publierMqtt(liste); return; }
    for (const [id, couleur, p] of liste) {
      const k = jeton();
      partage.enAttente.set(id, k);
      const nom = nomSeau(id);
      let f = partage.files.get(nom);
      if (!f) partage.files.set(nom, f = { champs: {}, enCours: false });
      f.champs[id] = { c: versHex(couleur), p: Number.isInteger(p) ? p : -1, k, by: partage.monId };
      if (!f.enCours) envoyer(nom, f);
    }
  }

  async function envoyer(nom, f) {
    f.enCours = true;
    while (partage.actif && Object.keys(f.champs).length) {
      const champs = f.champs;
      f.champs = {};
      try {
        await ecrireSeau(nom, champs);
      } catch (err) {
        echecEcriture(champs, err);
      }
    }
    f.enCours = false;
  }

  async function ecrireSeau(nom, champs) {
    const ref = partage.db.collection(COLLECTION).doc(nom);
    for (let essai = 0; ; essai++) {
      try {
        return await ref.update(champs);
      } catch (err) {
        const code = err && err.code;
        if (code === 'unavailable' && essai === 0) { await attendre(300 + Math.random() * 700); continue; }
        if (code !== 'invalid_argument') throw err;
        // Document pas encore créé : on le crée avec ce qu'on en connaît déjà.
        return await ref.set({ ...(partage.seaux.get(nom) || {}), ...champs });
      }
    }
  }

  function echecEcriture(champs, err) {
    const code = err && err.code;
    for (const cle of Object.keys(champs)) {
      const id = Number(cle);
      if (partage.enAttente.get(id) !== champs[cle].k) continue;   // une écriture plus récente suit
      partage.enAttente.delete(id);
      const e = lireEntree((partage.seaux.get(nomSeau(id)) || {})[cle]);
      const couleur = e ? e.couleur : BLANC;
      if (couleurs[id] !== couleur) remplirAnime(id, couleur, departDe(id, e ? e.p : -1));
    }
    if (code === 'invalid_argument') passerEnLectureSeule();
    else if (code === 'quota_exceeded') toast('Le dessin partagé est plein : cette couleur n’a pas été enregistrée.');
    else toast('Connexion perdue : cette couleur n’a pas été enregistrée.');
    majBoutons();
  }

  function passerEnLectureSeule() {
    if (partage.lectureSeule) return;
    partage.lectureSeule = true;
    historique.length = 0;
    champChat.disabled = true;
    champChat.placeholder = 'Lecture seule';
    desarmerEffacer();
    majBoutons();
    rendreEquipe();
  }

  // ---------- Présence : curseurs et personnes connectées ----------

  const maPresence = {};
  let presenceEnAttente = null, presencePrevue = 0, presenceMinuteur = 0, dernierePresence = 0;
  function envoyerPresence(patch) {
    for (const k in patch) {
      if (patch[k] === null) delete maPresence[k];
      else maPresence[k] = patch[k];
    }
    if (partage.mode === 'mqtt') {
      // Au plus une douzaine de messages par seconde vers les serveurs publics.
      if (!presenceMinuteur) {
        presenceMinuteur = setTimeout(() => { presenceMinuteur = 0; publierPresenceSur(null); },
          Math.max(0, 120 - (Date.now() - dernierePresence)));
      }
      return;
    }
    if (!partage.room) return;
    presenceEnAttente = { ...(presenceEnAttente || {}), ...patch };
    if (presencePrevue) return;
    presencePrevue = requestAnimationFrame(() => {
      presencePrevue = 0;
      const p = presenceEnAttente;
      presenceEnAttente = null;
      if (partage.room) partage.room.presence(p).catch(() => {});
    });
  }

  function positionNormalisee(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const x = (cx - r.left) / r.width, y = (cy - r.top) / r.height;
    if (!(x >= 0 && y >= 0 && x <= 1 && y <= 1)) return { x: null, y: null };
    return { x: Math.round(x * 1e4) / 1e4, y: Math.round(y * 1e4) / 1e4 };
  }

  const calqueCurseurs = $('curseurs');
  const curseurs = new Map();   // pair -> élément

  function creerCurseur() {
    const el = document.createElement('div');
    el.className = 'curseur';
    el.innerHTML = '<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 1.5v13.2l3.7-3.5 2.7 5.6 2.5-1.2-2.6-5.5H13Z"/></svg>'
      + '<span class="nom"><span class="nom-texte"></span></span>';
    return el;
  }

  function placerCurseurs() {
    const vus = new Set();
    if ((partage.room || partage.mode === 'mqtt') && zones) {
      const r = canvas.getBoundingClientRect(), c = calqueCurseurs.getBoundingClientRect();
      for (const p of partage.pairs) {
        if (p.isMe || p.kind !== 'viewer') continue;
        const pr = p.presence || {};
        if (typeof pr.x !== 'number' || typeof pr.y !== 'number') continue;
        vus.add(p.peer);
        let el = curseurs.get(p.peer);
        if (!el) {
          el = creerCurseur();
          curseurs.set(p.peer, el);
          calqueCurseurs.appendChild(el);
        }
        el.style.setProperty('--u', couleurDe(p));
        el.style.setProperty('--p', typeof pr.c === 'string' && /^#[0-9a-f]{6}$/i.test(pr.c) ? pr.c : '#ffffff');
        el.querySelector('.nom-texte').textContent = nomDe(p);
        const x = r.left - c.left + Math.min(1, Math.max(0, pr.x)) * r.width;
        const y = r.top - c.top + Math.min(1, Math.max(0, pr.y)) * r.height;
        el.style.transform = `translate(${x}px, ${y}px)`;
      }
    }
    for (const [peer, el] of curseurs) if (!vus.has(peer)) { el.remove(); curseurs.delete(peer); }
  }

  let seqEquipe = 0;
  async function majEquipe() {
    const seq = ++seqEquipe;
    const ids = [...new Set(partage.pairs.filter(p => p.kind === 'viewer' && p.by).map(p => p.by))];
    if (partage.user && ids.length) {
      try { partage.profils = await partage.user.profiles(ids); } catch (_) { /* noms indisponibles */ }
    }
    if (seq !== seqEquipe) return;
    rendreEquipe();
    placerCurseurs();
  }

  // Pseudo : choisi par chacun, partagé dans sa présence ; à défaut, le prénom du compte.
  const champPseudo = $('pseudo');
  const nettoyerPseudo = s => String(s || '').replace(/\p{C}/gu, '').replace(/\s+/g, ' ').trim().slice(0, 24);
  let monPseudo = '';
  try { monPseudo = nettoyerPseudo(localStorage.getItem(CLE_PSEUDO)); } catch (_) { /* pas de pseudo gardé */ }
  champPseudo.value = monPseudo;

  function definirPseudo(v, garder) {
    monPseudo = nettoyerPseudo(v);
    if (document.activeElement !== champPseudo) champPseudo.value = monPseudo;
    if (garder) {
      try { localStorage.setItem(CLE_PSEUDO, monPseudo); } catch (_) { /* tant pis */ }
    }
    envoyerPresence({ n: monPseudo || null });
    rendreEquipe();
  }
  champPseudo.addEventListener('input', () => definirPseudo(champPseudo.value, true));
  champPseudo.addEventListener('blur', () => { champPseudo.value = monPseudo; });
  champPseudo.addEventListener('keydown', e => { if (e.key === 'Enter') champPseudo.blur(); });

  function nomDe(p) {
    if (p.isMe && p.sameTab) return monPseudo || 'Toi';
    const pseudo = nettoyerPseudo(p.presence && p.presence.n);
    if (pseudo) return pseudo;
    const prof = p.by ? partage.profils[p.by] : null;
    return (prof && nettoyerPseudo(prof.name)) || 'Invité·e';
  }

  function couleurDe(p) {
    const prof = p.by ? partage.profils[p.by] : null;
    if (prof && prof.color) return prof.color;
    let h = 0;
    for (const ch of String(p.by || p.peer)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return `hsl(${h % 360} 55% 42%)`;
  }

  // Une personne avec deux onglets ne compte qu'une fois ; moi en premier.
  function personnesConnectees() {
    const personnes = new Map();
    for (const p of partage.pairs) {
      if (p.kind !== 'viewer') continue;
      const cle = p.by || p.peer;
      if (!personnes.has(cle) || p.sameTab) personnes.set(cle, p);
    }
    const liste = [...personnes.values()];
    if (!liste.some(p => p.isMe)) liste.push({ peer: 'moi', by: partage.monId, isMe: true, sameTab: true, kind: 'viewer', presence: {} });
    return liste.sort((a, b) => b.isMe - a.isMe);
  }

  let signatureEquipe = '';
  function rendreEquipe() {
    const ligne = $('direct');
    ligne.hidden = !partage.actif;
    if (!partage.actif) return;
    const joints = partage.connexions.filter(cx => cx.connecte).length;
    const enLigne = partage.mode !== 'mqtt' || joints > 0;
    const bloque = !enLigne && !partage.dejaConnecte && Date.now() - (partage.debutConnexion || Date.now()) > 12000;
    ligne.classList.toggle('lecture', partage.lectureSeule || !enLigne);
    $('direct-texte').textContent = partage.lectureSeule ? 'Lecture seule : demande l’accès « Éditeur » pour colorier'
      : enLigne ? 'Dessin partagé, en direct'
      : partage.dejaConnecte ? 'Hors ligne : tes couleurs partiront au retour du réseau'
      : bloque ? 'Partage bloqué par ce réseau : essaie un autre Wi-Fi ou la 4G'
      : 'Connexion au dessin partagé…';
    if (partage.mode === 'mqtt') {
      $('panneau-note').textContent = `Toute personne qui a le lien peut colorier avec toi. Serveurs de partage joints : ${joints} sur ${partage.connexions.length}.`;
    }

    const lignes = personnesConnectees().map(p => {
      const encre = p.isMe ? versHex(couleurCourante) : p.presence && p.presence.c;
      return {
        nom: nomDe(p), couleur: couleurDe(p), moi: p.isMe, by: p.by || '',
        encre: typeof encre === 'string' && /^#[0-9a-f]{6}$/i.test(encre) ? encre : '',
      };
    });
    // Les curseurs bougent sans cesse : on ne reconstruit la liste que si elle change vraiment.
    const signature = JSON.stringify(lignes);
    if (signature === signatureEquipe) return;
    signatureEquipe = signature;
    $('nb-connectes').textContent = String(lignes.length);
    $('connectes').replaceChildren(...lignes.map(l => {
      const li = document.createElement('li');
      li.className = 'connecte' + (l.moi ? ' moi' : '');
      li.dataset.by = l.by;
      const initiale = document.createElement('span');
      initiale.className = 'initiale';
      initiale.style.background = l.couleur;
      initiale.textContent = ([...l.nom][0] || '?').toUpperCase();
      const nom = document.createElement('span');
      nom.className = 'nom';
      nom.textContent = l.nom;
      li.append(initiale, nom);
      if (l.moi) {
        const toi = document.createElement('span');
        toi.className = 'toi';
        toi.textContent = '(toi)';
        li.append(toi);
      }
      if (l.encre) {
        const encre = document.createElement('span');
        encre.className = 'encre';
        encre.style.background = l.encre;
        encre.title = 'Sa couleur en main';
        li.append(encre);
      }
      return li;
    }));
  }

  // Fait briller la ligne de la personne qui vient de colorier.
  function flasher(by, couleur, moi) {
    for (const li of $('connectes').children) {
      const cible = moi ? li.classList.contains('moi') : (by && li.dataset.by === by && !li.classList.contains('moi'));
      if (!cible) continue;
      li.style.setProperty('--flash', versHex(couleur));
      li.classList.remove('peint');
      void li.offsetWidth;
      li.classList.add('peint');
    }
  }

  let minuteurToast = 0;
  function toast(texte) {
    const t = $('toast');
    t.textContent = texte;
    t.classList.add('visible');
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => t.classList.remove('visible'), 3200);
  }

  // « Recommencer » efface le dessin de tout le monde : on demande une seconde touche.
  let effacerArme = 0;
  function demanderEffacer() {
    if (!partage.actif) { effacer(); return; }
    if (effacerArme) { desarmerEffacer(); effacer(); return; }
    effacerArme = setTimeout(desarmerEffacer, 4000);
    btnEffacer.classList.add('danger');
    btnEffacer.querySelector('.label').textContent = 'Effacer pour tous ?';
    toast('Touche encore ce bouton pour effacer le dessin de tout le monde.');
  }
  function desarmerEffacer() {
    clearTimeout(effacerArme);
    effacerArme = 0;
    btnEffacer.classList.remove('danger');
    btnEffacer.querySelector('.label').textContent = 'Recommencer';
  }

  // ---------- Partage public : serveurs MQTT gratuits, sans compte ----------
  // Hors de claude.ai, chaque zone coloriée est un message « retenu » sur deux serveurs
  // publics : un nouvel arrivant reçoit tout le dessin d'un coup, puis les changements en
  // direct. En cas de conflit, la couleur la plus récente gagne (horloge de Lamport).
  // Chaque navigateur garde une copie du dessin et renvoie ce qui manque à un serveur
  // qui aurait tout oublié. Toute personne qui a le lien peut colorier.

  // Les deux premiers passent par le port 443 (celui des sites web), rarement bloqué par
  // les réseaux d'école ou d'entreprise ; les deux autres utilisent des ports spéciaux.
  const SERVEURS = (() => {
    const liste = new URLSearchParams(location.search).get('serveurs');
    if (liste) return liste.split(',').filter(Boolean).map(url => ({ url }));
    return [
      { url: 'wss://mqtt.eclipseprojects.io:443/mqtt' },
      { url: 'wss://public.cloud.shiftr.io:443', username: 'public', password: 'public' },
      { url: 'wss://broker.emqx.io:8084/mqtt' },
      { url: 'wss://broker.hivemq.com:8884/mqtt' },
    ];
  })();
  // Un autre dessin commun : ajouter #nom-du-salon à l'adresse.
  const SALON = (() => {
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    return /^[a-z0-9-]{3,40}$/.test(h) ? h : 'jura-k7q2m9x4';
  })();
  const SUJET = `coloriage-jura/v1/${SALON}/`;
  const CLE_CACHE = 'coloriage-jura-salon-' + SALON;
  const monClient = 'c' + Math.random().toString(36).slice(2, 12);
  const decodeur = new TextDecoder();
  const PSEUDOS = ['Lynx', 'Chamois', 'Sapin', 'Hibou', 'Truite', 'Écureuil', 'Morbier', 'Comté', 'Grenouille', 'Vin jaune'];

  const plusRecent = (a, b) => a.t > b.t || (a.t === b.t && a.u > b.u);

  function lireZone(v) {
    if (!v || typeof v !== 'object' || typeof v.c !== 'string' || !/^#[0-9a-f]{6}$/i.test(v.c) || !Number.isFinite(v.t)) return null;
    return { c: v.c.toLowerCase(), p: Number.isInteger(v.p) ? v.p : -1, t: v.t, u: typeof v.u === 'string' ? v.u.slice(0, 40) : '' };
  }
  function lireJson(texte) {
    try { return JSON.parse(texte); } catch (_) { return null; }
  }

  function brancherMqtt() {
    if (!window.mqtt || typeof window.mqtt.connect !== 'function') return false;
    partage.actif = true;
    partage.mode = 'mqtt';
    document.body.classList.add('partage', 'public');
    $('panneau-note').textContent = 'Toute personne qui a le lien peut colorier avec toi.';
    $('partager-lien').hidden = false;
    if (!monPseudo) definirPseudo(`${PSEUDOS[Math.random() * PSEUDOS.length | 0]} ${10 + (Math.random() * 90 | 0)}`, true);

    // La copie gardée sur cet appareil s'affiche tout de suite, avant même la connexion.
    const cache = lireJson((() => { try { return localStorage.getItem(CLE_CACHE); } catch (_) { return null; } })());
    if (cache && cache.zones === nbZones && cache.etat && typeof cache.etat === 'object') {
      for (const [cle, v] of Object.entries(cache.etat)) {
        const id = Number(cle), e = lireZone(v);
        if (!Number.isInteger(id) || id < 1 || id > nbZones || !e) continue;
        partage.etat.set(id, e);
        partage.horloge = Math.max(partage.horloge, e.t);
        teindre(id, versU32(e.c));
      }
      toutRendre();
    }
    envoyerPresence({ c: versHex(couleurCourante), n: monPseudo || null, a: monAuteur });
    majPairsMqtt();
    SERVEURS.forEach(connecterServeur);
    partage.debutConnexion = Date.now();
    setTimeout(rendreEquipe, 12500);
    setInterval(() => publierPresenceSur(null), 5000);
    setInterval(nettoyerPairs, 3000);
    window.addEventListener('pagehide', () => {
      for (const cx of partage.connexions) if (cx.client && cx.connecte) cx.client.publish(SUJET + 'p/' + monClient, '{"bye":1}', { qos: 0 });
    });
    return true;
  }

  function connecterServeur(serveur) {
    const cx = { client: null, connecte: false, pret: false, vus: new Map(), histo: [], reparation: 0, resemis: 0, histoPrevu: 0 };
    partage.connexions.push(cx);
    try {
      cx.client = window.mqtt.connect(serveur.url, {
        clientId: monClient + '-' + partage.connexions.length,
        ...(serveur.username ? { username: serveur.username, password: serveur.password } : {}),
        clean: true, keepalive: 30, reconnectPeriod: 4000, connectTimeout: 10000,
        will: { topic: SUJET + 'p/' + monClient, payload: '{"bye":1}', qos: 0, retain: false },
      });
    } catch (_) {
      return;
    }
    cx.client.on('connect', () => {
      cx.connecte = true;
      cx.vus.clear();   // le serveur va renvoyer ce qu'il a réellement gardé
      cx.histo = [];
      partage.dejaConnecte = true;
      cx.client.subscribe([SUJET + 'z/+', SUJET + 'p/+', SUJET + 'hello', SUJET + 'chat', SUJET + 'chat-historique'], { qos: 1 }, () => {
        cx.client.publish(SUJET + 'hello', monClient, { qos: 0 });
        publierPresenceSur(cx);
        clearTimeout(cx.resemis);
        cx.resemis = setTimeout(() => resemer(cx), 2500);
      });
      rendreEquipe();
    });
    cx.client.on('close', () => {
      cx.pret = false;
      if (!cx.connecte) return;
      cx.connecte = false;
      rendreEquipe();
    });
    cx.client.on('error', () => {});
    cx.client.on('message', (sujet, charge) => surMessage(cx, sujet, charge));
  }

  function surMessage(cx, sujet, charge) {
    if (!sujet.startsWith(SUJET)) return;
    const reste = sujet.slice(SUJET.length);
    const texte = decodeur.decode(charge);
    if (reste.startsWith('z/')) {
      const id = Number(reste.slice(2));
      const e = lireZone(lireJson(texte));
      if (!Number.isInteger(id) || id < 1 || id > nbZones || !e) return;
      const vu = cx.vus.get(id);
      if (!vu || plusRecent(e, vu)) cx.vus.set(id, e);
      if (recevoirZone(id, e)) {
        for (const autre of partage.connexions) {
          const dejaVu = autre.vus.get(id);
          if (autre !== cx && autre.pret && (!dejaVu || plusRecent(e, dejaVu))) envoyerZone(id, e, autre);
        }
      }
    } else if (reste.startsWith('p/')) {
      const qui = reste.slice(2);
      if (qui !== monClient && /^c[a-z0-9]{1,20}$/.test(qui)) recevoirPresence(qui, lireJson(texte));
    } else if (reste === 'chat') {
      if (recevoirMessages([lireJson(texte)], true)) {
        for (const autre of partage.connexions) {
          if (autre === cx || !autre.pret) continue;
          autre.client.publish(SUJET + 'chat', texte, { qos: 1 });
          programmerHistorique(autre);
        }
      }
    } else if (reste === 'chat-historique') {
      const v = lireJson(texte);
      if (!v || !Array.isArray(v.messages)) return;
      cx.histo = v.messages.slice(-60);
      recevoirMessages(cx.histo, false);
      if (manquants(cx.histo, true)) {
        clearTimeout(cx.reparation);
        cx.reparation = setTimeout(() => { if (manquants(cx.histo, true)) publierHistorique(cx); }, 300 + Math.random() * 500);
      }
    } else if (reste === 'hello' && texte !== monClient) {
      setTimeout(() => publierPresenceSur(cx), Math.random() * 400);
    }
  }

  let arrivees = [], arriveesPrevues = 0, cachePrevu = 0;
  function recevoirZone(id, e) {
    const actuel = partage.etat.get(id);
    if (actuel && !plusRecent(e, actuel)) return false;
    partage.etat.set(id, e);
    if (e.t > partage.horloge) partage.horloge = e.t;
    programmerCache();
    arrivees.push(id);
    if (!arriveesPrevues) arriveesPrevues = setTimeout(viderArrivees, 16);
    return true;
  }

  // Les messages arrivent en rafale à la connexion : on les applique par paquet, en
  // relisant l'état à jour (un clic local a pu passer devant entre-temps).
  function viderArrivees() {
    arriveesPrevues = 0;
    const changes = [];
    for (const id of new Set(arrivees)) {
      const e = partage.etat.get(id);
      const couleur = e ? versU32(e.c) : BLANC;
      if (couleurs[id] !== couleur) changes.push({ id, couleur, p: e ? e.p : -1, by: e ? e.u : null });
    }
    arrivees = [];
    appliquerDistants(changes);
    partage.premier = false;
    majBoutons();
  }

  function publierMqtt(liste) {
    for (const [id, couleur, p] of liste) {
      partage.horloge = Math.max(Date.now(), partage.horloge + 1);
      const e = { c: versHex(couleur), p: Number.isInteger(p) ? p : -1, t: partage.horloge, u: monAuteur };
      partage.etat.set(id, e);
      envoyerZone(id, e, null);
    }
    programmerCache();
  }

  function envoyerZone(id, e, seul) {
    const texte = JSON.stringify(e);
    for (const cx of seul ? [seul] : partage.connexions) {
      if (cx.client) cx.client.publish(SUJET + 'z/' + id, texte, { qos: 1, retain: true });
    }
  }

  // Renvoie à un serveur les zones qu'il n'a pas (ou dans une version plus ancienne).
  function resemer(cx) {
    if (!cx.connecte) return;
    cx.pret = true;
    if (manquants(cx.histo, false)) publierHistorique(cx);
    const aEnvoyer = [];
    for (const [id, e] of partage.etat) {
      const vu = cx.vus.get(id);
      if (!vu || plusRecent(e, vu)) aEnvoyer.push([id, e]);
    }
    // Par paquets, pour ne pas se faire limiter par les serveurs publics.
    const paquet = () => {
      if (!cx.connecte) return;
      for (const [id, e] of aEnvoyer.splice(0, 40)) envoyerZone(id, e, cx);
      if (aEnvoyer.length) setTimeout(paquet, 250);
    };
    paquet();
  }

  function programmerHistorique(cx) {
    clearTimeout(cx.histoPrevu);
    cx.histoPrevu = setTimeout(() => { if (cx.pret && manquants(cx.histo, false)) publierHistorique(cx); }, 800 + Math.random() * 700);
  }

  function programmerCache() {
    if (cachePrevu) return;
    cachePrevu = setTimeout(() => {
      cachePrevu = 0;
      try {
        localStorage.setItem(CLE_CACHE, JSON.stringify({ zones: nbZones, etat: Object.fromEntries(partage.etat) }));
      } catch (_) { /* stockage indisponible : le dessin reste sur les serveurs */ }
    }, 600);
  }

  let seqPresence = 0;
  function publierPresenceSur(seul) {
    const texte = JSON.stringify({ ...maPresence, s: ++seqPresence });
    for (const cx of seul ? [seul] : partage.connexions) {
      if (cx.client && cx.connecte) cx.client.publish(SUJET + 'p/' + monClient, texte, { qos: 0 });
    }
    dernierePresence = Date.now();
  }

  const pairsMqtt = new Map();   // client -> { presence, s, vu }
  function recevoirPresence(qui, v) {
    if (!v || typeof v !== 'object') return;
    if (v.bye) {
      if (pairsMqtt.delete(qui)) majPairsMqtt();
      return;
    }
    const s = Number.isFinite(v.s) ? v.s : 0;
    const ancien = pairsMqtt.get(qui);
    if (ancien) ancien.vu = Date.now();
    if (ancien && s <= ancien.s) return;   // doublon venu du second serveur, ou message en retard
    pairsMqtt.set(qui, {
      s, vu: Date.now(),
      presence: {
        n: typeof v.n === 'string' ? v.n : '',
        c: typeof v.c === 'string' ? v.c : '',
        x: typeof v.x === 'number' ? v.x : null,
        y: typeof v.y === 'number' ? v.y : null,
        a: typeof v.a === 'string' && /^a[a-z0-9]{6,16}$/.test(v.a) ? v.a : null,
      },
    });
    majPairsMqtt();
  }

  function majPairsMqtt() {
    partage.pairs = [
      { peer: monClient, by: monAuteur, isMe: true, sameTab: true, kind: 'viewer', presence: maPresence },
      ...[...pairsMqtt].map(([qui, p]) => {
        const by = p.presence.a || qui;
        return { peer: qui, by, isMe: by === monAuteur, sameTab: false, kind: 'viewer', presence: p.presence };
      }),
    ];
    placerCurseurs();
    rendreEquipe();
  }

  function nettoyerPairs() {
    const limite = Date.now() - 15000;
    let change = false;
    for (const [qui, p] of pairsMqtt) if (p.vu < limite) { pairsMqtt.delete(qui); change = true; }
    if (change) majPairsMqtt();
  }

  $('partager-lien').addEventListener('click', async () => {
    const lien = location.href.replace(/[?].*?(?=#|$)/, '');
    if (navigator.share && matchMedia('(pointer: coarse)').matches) {
      try { await navigator.share({ title: 'Coloriage du Jura', url: lien }); return; } catch (_) { /* partage annulé : on copie */ }
    }
    try {
      await navigator.clipboard.writeText(lien);
      toast('Lien copié : envoie-le à qui tu veux pour colorier ensemble.');
    } catch (_) {
      toast(lien);
    }
  });

  // ---------- Tchat ----------
  // Les 50 derniers messages sont gardés dans le dessin partagé : un nouvel arrivant voit
  // la conversation en cours. Chaque message porte un identifiant, on fusionne sans doublon.

  const CLE_AUTEUR = 'coloriage-jura-auteur';
  const monAuteur = (() => {
    const neuf = () => 'a' + Math.random().toString(36).slice(2, 12);
    try {
      let a = localStorage.getItem(CLE_AUTEUR);
      if (!/^a[a-z0-9]{6,16}$/.test(a || '')) { a = neuf(); localStorage.setItem(CLE_AUTEUR, a); }
      return a;
    } catch (_) {
      return neuf();
    }
  })();
  const messages = new Map();        // id -> message
  const listeMessages = $('messages'), champChat = $('chat-texte');
  const ecranEtroit = matchMedia('(max-width: 760px)');
  let nonLus = 0, dernierMessageEnvoye = 0, allerEnBas = true;

  const nettoyerMessage = s => String(s || '').replace(/\p{C}/gu, ' ').replace(/\s+/g, ' ').trim().slice(0, 300);
  function lireMessage(v) {
    if (!v || typeof v !== 'object' || typeof v.id !== 'string' || !/^m[a-z0-9]{4,20}$/.test(v.id) || !Number.isFinite(v.t)) return null;
    const m = nettoyerMessage(v.m);
    if (!m) return null;
    return { id: v.id, m, t: v.t, n: nettoyerPseudo(v.n) || 'Invité·e', u: typeof v.u === 'string' ? v.u.slice(0, 40) : '' };
  }
  const estMoi = u => u === monAuteur || (!!partage.monId && u === partage.monId);
  const derniers = n => [...messages.values()].sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1)).slice(-n);

  // Messages récents absents d'un historique reçu (écrasés par un envoi simultané,
  // ou perdus par le serveur). `lesMiens` : ne regarder que mes propres messages.
  function manquants(liste, lesMiens) {
    const ids = new Set(), dates = [];
    for (const x of liste) if (x && typeof x.id === 'string') { ids.add(x.id); if (Number.isFinite(x.t)) dates.push(x.t); }
    const plancher = liste.length >= 50 && dates.length ? Math.min(...dates) : -Infinity;
    return derniers(50).some(msg => (!lesMiens || estMoi(msg.u)) && !ids.has(msg.id) && msg.t >= plancher);
  }

  // `direct` : message arrivé à l'instant (son, pastille), sinon historique.
  function recevoirMessages(liste, direct) {
    let ajoutes = 0, desAutres = 0;
    for (const v of liste) {
      const msg = lireMessage(v);
      if (!msg || messages.has(msg.id)) continue;
      messages.set(msg.id, msg);
      ajoutes++;
      if (!estMoi(msg.u)) desAutres++;
    }
    if (!ajoutes) return 0;
    if (messages.size > 150) for (const msg of derniers(messages.size).slice(0, messages.size - 150)) messages.delete(msg.id);
    rendreChat();
    if (direct && desAutres) {
      if (!chatVisible()) { nonLus += desAutres; majBadge(); }
      sonMessage();
    }
    return ajoutes;
  }

  function rendreChat() {
    const enBas = allerEnBas || listeMessages.scrollHeight - listeMessages.scrollTop - listeMessages.clientHeight < 48;
    allerEnBas = false;
    const liste = derniers(150);
    if (!liste.length) {
      const vide = document.createElement('li');
      vide.className = 'chat-vide';
      vide.textContent = 'Aucun message pour l’instant. Dis bonjour !';
      listeMessages.replaceChildren(vide);
      return;
    }
    let precedent = null;
    listeMessages.replaceChildren(...liste.map(msg => {
      const moi = estMoi(msg.u);
      const li = document.createElement('li');
      li.className = 'message' + (moi ? ' moi' : '');
      if (!precedent || precedent.u !== msg.u || msg.t - precedent.t > 120000) {
        const tete = document.createElement('div');
        tete.className = 'message-tete';
        const pastille = document.createElement('span');
        pastille.className = 'pastille';
        pastille.style.background = couleurDe({ by: msg.u, peer: msg.u });
        const auteur = document.createElement('span');
        auteur.className = 'auteur';
        auteur.textContent = moi ? 'Toi' : msg.n;
        const heure = document.createElement('time');
        heure.textContent = new Date(msg.t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        tete.append(pastille, auteur, heure);
        li.append(tete);
      }
      const bulle = document.createElement('p');
      bulle.className = 'bulle';
      bulle.textContent = msg.m;
      li.append(bulle);
      precedent = msg;
      return li;
    }));
    if (enBas) listeMessages.scrollTop = listeMessages.scrollHeight;
  }

  const chatVisible = () => !ecranEtroit.matches || document.body.classList.contains('chat-ouvert');
  function majBadge() {
    const b = $('badge-chat');
    b.hidden = !nonLus;
    b.textContent = nonLus > 9 ? '9+' : String(nonLus);
  }
  $('ouvrir-chat').addEventListener('click', () => {
    document.body.classList.add('chat-ouvert');
    nonLus = 0;
    majBadge();
    listeMessages.scrollTop = listeMessages.scrollHeight;
  });
  $('chat-fermer').addEventListener('click', () => document.body.classList.remove('chat-ouvert'));

  function sonMessage() {
    const ac = contexteAudio();
    if (!ac) return;
    const t = ac.currentTime + 0.005;
    ton(ac, t, { f0: 880, f1: 1320, montee: 0.04, volume: 0.09, duree: 0.12 });
    ton(ac, t + 0.09, { f0: 1320, f1: 1760, montee: 0.04, volume: 0.07, duree: 0.14 });
  }

  $('chat-form').addEventListener('submit', e => {
    e.preventDefault();
    const m = nettoyerMessage(champChat.value);
    if (!m || !partage.actif || partage.lectureSeule) return;
    if (Date.now() - dernierMessageEnvoye < 500) return;
    dernierMessageEnvoye = Date.now();
    const msg = { id: 'm' + Math.random().toString(36).slice(2, 12), m, t: Date.now(), n: monPseudo || 'Invité·e', u: partage.monId || monAuteur };
    champChat.value = '';
    messages.set(msg.id, msg);
    allerEnBas = true;
    rendreChat();
    if (partage.mode === 'mqtt') {
      for (const cx of partage.connexions) if (cx.client) cx.client.publish(SUJET + 'chat', JSON.stringify(msg), { qos: 1 });
      publierHistorique(null);
    } else {
      ecrireChatClaude();
    }
  });

  // Partage public : messages en direct + historique retenu sur chaque serveur.
  function publierHistorique(seul) {
    const texte = JSON.stringify({ messages: derniers(50) });
    for (const cx of seul ? [seul] : partage.connexions) {
      if (cx.client) cx.client.publish(SUJET + 'chat-historique', texte, { qos: 1, retain: true });
    }
  }

  // claude.ai : un document qui garde les 50 derniers messages.
  let refChat = null, chatEcriture = false, aRefaire = false, premierChat = true, chatServeur = [], reparation = 0;
  function brancherChatClaude(db) {
    refChat = db.collection('chat').doc('historique');
